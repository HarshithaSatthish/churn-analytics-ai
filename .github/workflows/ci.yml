name: project-validation

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile source
        run: python -m compileall -q app.py _shared.py pages src tests
      - name: Rebuild data and model artifacts
        run: |
          python src/01_clean.py
          python src/02_eda.py
          python src/03_model.py
      - name: Validate wiring and inference
        run: python src/04_validate.py
      - name: Validate deployment packaging
        run: python src/05_deployment_check.py
      - name: Run contract tests
        run: python -m unittest discover -s tests -v
